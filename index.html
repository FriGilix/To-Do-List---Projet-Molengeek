<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/public/css/style.css">
    
</head>
<body>
<img src="https://lh3.googleusercontent.com/_2NDMvODh9fTbW9Wd9D8iWkrKkPagS-InKTS87voOo7TDWCWP7tSM28F29gfAXWd_VTzmwGp-0sh67gu7JiZqGtDZWs=s800-w800-h500">
<div id="todo-app">
    <h1>Projet To-Do List</h1>
    <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Ajoutez un élement">
        <button type="submit">Ajoutez</button>
    </form>
    <ul id="todo-list">

    </ul>
</div>

<div class="calculator-container">
    <div class="calculator-icon" onclick="toggleCalculator()">⌘</div>
    <div class="calculator" id="calculator">
        <input type="text" id="display" readonly>
        <div>
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            
        </div>
        <div>
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            
        </div>
        <div>
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button onclick="appendNumber('0')">0</button>
            
        </div>
        <div>
            <button onclick="clearDisplay()">C</button>
            <button onclick="setOperator('+')">+</button>
            <button onclick="setOperator('-')">-</button>
            <button onclick="setOperator('*')">*</button>
            <button onclick="setOperator('/')">/</button>
            <button onclick="calculateResult()">=</button>
            
        </div>
    </div>
</div>
    <script src="/public/js/main.js"></script>
</body>
</html>
